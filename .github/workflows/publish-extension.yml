name: Build and Publish Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_chrome:
        description: 'Publish to Chrome Web Store'
        required: false
        default: false
        type: boolean
      publish_firefox:
        description: 'Publish to Firefox Add-ons'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Get version from manifest
        id: version
        run: |
          VERSION=$(jq -r '.version' public/manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build extension
        run: bun run build

      - name: Copy base assets to dist
        run: |
          cp public/*.png dist/ 2>/dev/null || true

      - name: Create Chrome extension zip
        run: |
          # Create Chrome-specific manifest (uses service_worker)
          jq '
            del(.browser_specific_settings) |
            .background = {"service_worker": "background.js", "type": "module"}
          ' public/manifest.json > dist/manifest.json
          cd dist
          zip -r ../qbits-chrome-v${{ steps.version.outputs.version }}.zip .

      - name: Create Firefox extension zip
        run: |
          # Create Firefox-specific manifest (uses scripts array)
          jq '
            .background = {"scripts": ["background.js"], "type": "module"}
          ' public/manifest.json > dist/manifest.json
          cd dist
          zip -r ../qbits-firefox-v${{ steps.version.outputs.version }}.zip .

      - name: Upload Chrome extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: qbits-chrome-v${{ steps.version.outputs.version }}.zip

      - name: Upload Firefox extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-extension
          path: qbits-firefox-v${{ steps.version.outputs.version }}.zip

  # NOTE: Publishing to stores is disabled while waiting for account verification
  # Set the workflow_dispatch inputs to true to enable publishing when ready
  publish-chrome:
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.publish_chrome == 'true'
    steps:
      - name: Download Chrome extension artifact
        uses: actions/download-artifact@v4
        with:
          name: chrome-extension

      - name: Publish to Chrome Web Store
        uses: mobilefirstllc/cws-publish@latest
        with:
          action: publish
          client_id: ${{ secrets.CHROME_CLIENT_ID }}
          client_secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh_token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          extension_id: ${{ secrets.CHROME_EXTENSION_ID }}
          zip_file: qbits-chrome-v${{ needs.build.outputs.version }}.zip

  publish-firefox:
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.publish_firefox == 'true'
    steps:
      - name: Download Firefox extension artifact
        uses: actions/download-artifact@v4
        with:
          name: firefox-extension

      - name: Publish to Firefox Add-ons
        uses: browser-actions/release-firefox-addon@latest
        with:
          addon-id: ${{ secrets.FIREFOX_ADDON_ID }}
          addon-path: qbits-firefox-v${{ needs.build.outputs.version }}.zip
          auth-api-issuer: ${{ secrets.FIREFOX_API_ISSUER }}
          auth-api-secret: ${{ secrets.FIREFOX_API_SECRET }}

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Chrome extension artifact
        uses: actions/download-artifact@v4
        with:
          name: chrome-extension

      - name: Download Firefox extension artifact
        uses: actions/download-artifact@v4
        with:
          name: firefox-extension

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            qbits-chrome-v${{ needs.build.outputs.version }}.zip
            qbits-firefox-v${{ needs.build.outputs.version }}.zip
          generate_release_notes: true
